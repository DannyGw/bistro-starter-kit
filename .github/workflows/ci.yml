name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install toolchain
        run: npm ci

      - name: JavaScript parses
        run: |
          for file in config.js tailwind.config.js assets/js/*.js i18n/*.js tools/*.js; do
            node --check "$file"
          done

      - name: Translation dictionaries are complete
        run: npm run check:i18n

      # assets/css/tailwind.css is committed so the site deploys with no build
      # step. That only holds if the artefact matches the markup — rebuild and
      # fail when it drifts.
      - name: Compiled CSS is up to date
        run: |
          npm run build:css
          git diff --exit-code -- assets/css/tailwind.css \
            || (echo "::error::assets/css/tailwind.css is stale — run 'npm run build:css' and commit the result." && exit 1)
